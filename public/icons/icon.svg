<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hard neo-brutalist shadow -->
  <rect x="52" y="52" width="440" height="440" rx="88" fill="#111111" />
  <!-- Main yellow card -->
  <rect x="36" y="36" width="440" height="440" rx="88" fill="#FFD84D" stroke="#111111" stroke-width="22" />

  <!-- 3D Shadow for Lightning Bolt -->
  <polygon points="314,114 170,276 249,280 215,416 359,255 280,250" fill="#DAA520" stroke="#DAA520" stroke-width="15" stroke-linejoin="round" />

  <!-- Playful Neo-brutalist lightning symbol -->
  <polygon points="306,106 162,268 241,272 207,408 351,247 272,242" fill="#111111" stroke="#111111" stroke-width="15" stroke-linejoin="round" />

  <!-- Pink accent badge -->
  <g transform="rotate(-5 335 148)">
    <rect x="282" y="129" width="118" height="50" rx="17" fill="#111111" />
    <rect x="276" y="123" width="118" height="50" rx="17" fill="#FF8FAB" stroke="#111111" stroke-width="8" />
    <text x="335" y="157" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" fill="#111111" text-anchor="middle">CASH</text>
  </g>
</svg>
