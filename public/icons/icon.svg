<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hard neo-brutalist shadow -->
  <rect x="36" y="36" width="456" height="456" rx="80" fill="#111111" />
  <!-- Main yellow card -->
  <rect x="20" y="20" width="456" height="456" rx="80" fill="#FFD84D" stroke="#111111" stroke-width="24" />
  
  <!-- Playful Neo-brutalist lightning symbol -->
  <polygon points="280,70 150,270 260,270 232,442 362,242 252,242" fill="#111111" stroke="#111111" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Pink accent badge on top corner -->
  <rect x="330" y="50" width="110" height="48" rx="16" fill="#FF8FAB" stroke="#111111" stroke-width="10" />
  <text x="385" y="82" font-family="sans-serif" font-size="24" font-weight="900" fill="#111111" text-anchor="middle">CASH</text>
</svg>
